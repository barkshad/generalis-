<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Generali's Bar & Kitchen – Kilifi</title>
  <meta name="description" content="Discover coastal flavours, vibrant nights and local energy in Kilifi at Generali's Bar & Kitchen." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#E58A4E', // Fiery orange-gold
            charcoal: '#2C2A29', // Warmer, softer dark color
            background: '#FDFBF7', // Soft, warm off-white
          },
          fontFamily: {
            heading: ['Poppins', 'sans-serif'],
            body: ['Roboto', 'sans-serif']
          },
          animation: {
            'slide-in': 'slideIn 0.3s ease-out forwards',
            'fade-in': 'fadeIn 0.2s ease-in forwards',
            'kenburns': 'kenburns 20s ease-out forwards',
          },
          keyframes: {
            slideIn: {
              '0%': { transform: 'translateX(100%)' },
              '100%': { transform: 'translateX(0)' },
            },
            fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
            },
            kenburns: {
              '0%': { transform: 'scale(1) translate(0, 0)' },
              '100%': { transform: 'scale(1.1) translate(-2%, 2%)' },
            }
          }
        }
      }
    }
  </script>
<script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",

    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.27.0"
  }
}
</script>
</head>
<body class="antialiased text-charcoal font-body bg-background">
  <div id="root"></div>
</body>
</html>
