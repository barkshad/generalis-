<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Generali's Bar & Kitchen – Kilifi</title>
  <meta name="description" content="Discover coastal flavours, vibrant nights and local energy in Kilifi at Generali's Bar & Kitchen." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#C5A059',
            charcoal: '#1A1A1A',
            background: '#FCFAF7',
          },
          fontFamily: {
            heading: ['"Playfair Display"', 'serif'],
            body: ['Montserrat', 'sans-serif']
          },
          animation: {
            'slide-in': 'slideIn 0.3s ease-out forwards',
            'fade-in': 'fadeIn 0.6s ease-in forwards',
            'kenburns': 'kenburns 30s ease-out infinite alternate',
          },
          keyframes: {
            slideIn: {
              '0%': { transform: 'translateX(100%)' },
              '100%': { transform: 'translateX(0)' },
            },
            fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            kenburns: {
              '0%': { transform: 'scale(1) translate(0, 0)' },
              '100%': { transform: 'scale(1.15) translate(-1%, 1%)' },
            }
          }
        }
      }
    }
  </script>

}
</script>
